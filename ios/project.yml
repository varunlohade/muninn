name: Muninn
options:
  bundleIdPrefix: com.orseliyas
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: GV3ZK5CT6G
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "7"
    # The one place for the app name. Both Info.plists read it.
    PRODUCT_DISPLAY_NAME: Muninn
    KEYBOARD_DISPLAY_NAME: $(PRODUCT_DISPLAY_NAME) Keyboard
    APP_GROUP_ID: group.com.orseliyas.muninn
    # Server URLs. Debug builds default to the local server; Release defaults to the hosted demo server.
    DEMO_SERVER_URL: https:/$()/muninn-api-production-ea1c.up.railway.app
    GENERATE_INFOPLIST_FILE: NO
  configs:
    Debug:
      DEFAULT_SERVER_URL: http:/$()/localhost:8787
    Release:
      DEFAULT_SERVER_URL: $(DEMO_SERVER_URL)
targets:
  Muninn:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      # The drawing page (Excalidraw, MIT), built from visual/ (npm run build). A folder reference keeps its paths.
      - path: Visual
        type: folder
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: $(PRODUCT_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppName: $(PRODUCT_DISPLAY_NAME)
        DefaultServerURL: $(DEFAULT_SERVER_URL)
        DemoServerURL: $(DEMO_SERVER_URL)
        KeyboardName: $(KEYBOARD_DISPLAY_NAME)
        UIAppFonts: [Figtree-Regular.ttf, Figtree-Medium.ttf, Figtree-SemiBold.ttf, Newsreader-Regular.ttf, IBMPlexMono-Regular.ttf]
        AppGroupID: $(APP_GROUP_ID)
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        # The paper color, so launch goes paper → splash → Home with no white flash.
        UILaunchScreen: { UIColorName: LaunchBackground }
        NSCalendarsFullAccessUsageDescription: $(PRODUCT_DISPLAY_NAME) reads today's appointments to suggest who to bill, and adds the events you type. They stay on this phone.
        NSCalendarsWriteOnlyAccessUsageDescription: $(PRODUCT_DISPLAY_NAME) adds the events you type, such as "meeting with Ana tomorrow 3pm".
        NSRemindersFullAccessUsageDescription: $(PRODUCT_DISPLAY_NAME) adds the reminders you type, such as "call supplier at 5". They stay on this phone.
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSContactsUsageDescription: $(PRODUCT_DISPLAY_NAME) uses the one email you pick from Contacts to send that client's invoice. Nothing else is read.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: App/Muninn.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
        keychain-access-groups: [$(AppIdentifierPrefix)com.orseliyas.muninn.shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orseliyas.muninn
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPhone only: the app is portrait and has no iPad layout.
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: MuninnKeyboard
    # The muninn-dev pairing link is for Debug builds only, so the Release Info.plist never declares it.
    postBuildScripts:
      - name: Dev URL scheme (Debug only)
        basedOnDependencyAnalysis: false
        # The built Info.plist is an input, so this always runs after Xcode writes it.
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          if [ "$CONFIGURATION" = "Debug" ]; then
            plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
            /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" -c "Add :CFBundleURLTypes:0 dict" \
              -c "Add :CFBundleURLTypes:0:CFBundleURLName string com.orseliyas.muninn.dev" \
              -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string muninn-dev" "$plist"
          fi
  MuninnKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - Keyboard
      - Shared
      - path: Visual
        type: folder
        buildPhase: resources
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: $(KEYBOARD_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppName: $(PRODUCT_DISPLAY_NAME)
        DefaultServerURL: $(DEFAULT_SERVER_URL)
        DemoServerURL: $(DEMO_SERVER_URL)
        KeyboardName: $(KEYBOARD_DISPLAY_NAME)
        AppGroupID: $(APP_GROUP_ID)
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        # The bar and panels use the app's type. The keys stay the system font.
        UIAppFonts: [Figtree-Regular.ttf, Figtree-Medium.ttf, IBMPlexMono-Regular.ttf]
        NSCalendarsFullAccessUsageDescription: $(PRODUCT_DISPLAY_NAME) reads today's appointments to suggest who to bill, and adds the events you type. They stay on this phone.
        NSCalendarsWriteOnlyAccessUsageDescription: $(PRODUCT_DISPLAY_NAME) adds the events you type, such as "meeting with Ana tomorrow 3pm".
        NSRemindersFullAccessUsageDescription: $(PRODUCT_DISPLAY_NAME) adds the reminders you type, such as "call supplier at 5". They stay on this phone.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
    entitlements:
      path: Keyboard/MuninnKeyboard.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
        keychain-access-groups: [$(AppIdentifierPrefix)com.orseliyas.muninn.shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orseliyas.muninn.keyboard
        APPLICATION_EXTENSION_API_ONLY: YES
        TARGETED_DEVICE_FAMILY: "1"
  MuninnTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orseliyas.muninn.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Muninn
  MuninnUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orseliyas.muninn.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Muninn
schemes:
  Muninn:
    build:
      targets:
        Muninn: all
        MuninnKeyboard: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [MuninnTests, MuninnUITests]
