name: Muninn
options:
  bundleIdPrefix: com.orseliyas
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: GV3ZK5CT6G
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    # The one place for the app name. Both Info.plists read it.
    PRODUCT_DISPLAY_NAME: Muninn
    KEYBOARD_DISPLAY_NAME: $(PRODUCT_DISPLAY_NAME) Keyboard
    APP_GROUP_ID: group.com.orseliyas.muninn
    GENERATE_INFOPLIST_FILE: NO
targets:
  Muninn:
    type: application
    platform: iOS
    sources: [App, Shared]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: $(PRODUCT_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppName: $(PRODUCT_DISPLAY_NAME)
        KeyboardName: $(KEYBOARD_DISPLAY_NAME)
        UIAppFonts: [Geist-Regular.ttf, Geist-Medium.ttf, Geist-SemiBold.ttf, GeistMono-Medium.ttf]
        AppGroupID: $(APP_GROUP_ID)
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.orseliyas.muninn.dev
            CFBundleURLSchemes: [muninn-dev]
    entitlements:
      path: App/Muninn.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
        keychain-access-groups: [$(AppIdentifierPrefix)com.orseliyas.muninn.shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orseliyas.muninn
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: MuninnKeyboard
  MuninnKeyboard:
    type: app-extension
    platform: iOS
    sources: [Keyboard, Shared]
    info:
      path: Keyboard/Info.plist
      properties:
        CFBundleDisplayName: $(KEYBOARD_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppName: $(PRODUCT_DISPLAY_NAME)
        KeyboardName: $(KEYBOARD_DISPLAY_NAME)
        UIAppFonts: [Geist-Regular.ttf, Geist-Medium.ttf, Geist-SemiBold.ttf, GeistMono-Medium.ttf]
        AppGroupID: $(APP_GROUP_ID)
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: false
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
    entitlements:
      path: Keyboard/MuninnKeyboard.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
        keychain-access-groups: [$(AppIdentifierPrefix)com.orseliyas.muninn.shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orseliyas.muninn.keyboard
        APPLICATION_EXTENSION_API_ONLY: YES
  MuninnUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.orseliyas.muninn.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Muninn
schemes:
  Muninn:
    build:
      targets:
        Muninn: all
        MuninnKeyboard: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [MuninnUITests]
