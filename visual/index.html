<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Muninn visual</title>
<script>window.EXCALIDRAW_ASSET_PATH = new URL('./', document.baseURI).href</script>
<style>
  html, body, #root { margin: 0; height: 100%; overflow: hidden; background: #fff; }
  /* Our own native toolbar drives the canvas; Excalidraw's menus and toolbars stay hidden. */
  .excalidraw .layer-ui__wrapper, .excalidraw .App-bottom-bar, .excalidraw .welcome-screen-center, .excalidraw .App-toolbar-container,
  .excalidraw .mobile-misc-tools-container, .excalidraw .App-mobile-menu, .excalidraw footer { display: none !important; }
  /* The pen: a small dot in Muninn's accent that leads each stroke. */
  .pip-pen { position: absolute; z-index: 1001; width: 14px; height: 14px; margin: -7px 0 0 -7px; pointer-events: none; transition: opacity .3s;
    border-radius: 50%; background: #0088FF; box-shadow: 0 0 0 3px #fff, 0 2px 6px rgba(0,0,0,.25); }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="./src/main.jsx"></script>
</body>
</html>
